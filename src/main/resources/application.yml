server:
  port: 8085

spring:
  application:
    name: ms-auditoria
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  # ---- Apache Kafka: eventos de analitica (navegacion, pagos, fraude, transacciones) ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9094,localhost:9096}
    replicas: ${KAFKA_REPLICAS:3}             # factor de replicacion (1 si usas un solo broker en local)
    group-id: ms-auditoria               # consumer group propio: recibe TODOS los eventos de los 4 topicos
    concurrency: 3                       # 3 hilos = hasta 3 particiones en paralelo
    reintentos: 2
    topicos:
      navegacion:                        # interacciones del usuario: alto volumen, valor de corto plazo
        nombre: pedidos360.navegacion
        particiones: 3
        retencion-ms: 604800000          # 7 dias
        min-isr: 1
      pagos:                             # resultado de cada pago: historico financiero
        nombre: pedidos360.pagos
        particiones: 3
        retencion-ms: 2592000000         # 30 dias
        min-isr: 2                       # con acks=all: 2 replicas deben confirmar
      fraude:                            # alertas antifraude: bajo volumen, orden global, se guardan mas tiempo
        nombre: pedidos360.fraude
        particiones: 1
        retencion-ms: 7776000000         # 90 dias
        min-isr: 2
      transacciones:                     # checkout, orden creada, correo enviado (antes en RabbitMQ auditoria.todos)
        nombre: pedidos360.transacciones
        particiones: 3
        retencion-ms: 2592000000         # 30 dias
        min-isr: 2
  azure:
    tenant-id: ${AZURE_TENANT_ID:d276cca8-e687-4f20-8984-601387d11401}
    client-id: ${AZURE_CLIENT_ID:39a9591b-35f1-4165-8cf2-667a2c643920}
  security:
    require-roles: ${REQUIRE_ROLES:true}
